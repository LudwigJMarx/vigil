# Baut die Binaerdateien fuer eine Veroeffentlichung.
#
# Es gibt sie, weil "einfach einzusetzen" nur stimmt, wenn jemand ohne Go eine
# Datei herunterladen kann. CGO_ENABLED=0 ist dabei keine Vorsichtsmassnahme,
# sondern die Bedingung: der SQLite-Treiber ist reines Go, und nur deshalb
# entstehen diese fuenf Ziele aus einem Laeufer ohne C-Werkzeugkette.
#
# Der Versionsstempel kommt aus dem Tag. Ein Binary, das "dev" meldet, waehrend
# es aus einem Tag gebaut wurde, laesst jeden Fehlerbericht ins Leere laufen.

name: Veroeffentlichen

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bauen:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ziel:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Nichts veroeffentlichen, was nicht durch die Tests gegangen ist. Ein
      # Tag ist keine Pruefung.
      - name: Tests
        run: go test ./...

      - name: Bauen
        env:
          GOOS: ${{ matrix.ziel.goos }}
          GOARCH: ${{ matrix.ziel.goarch }}
          CGO_ENABLED: "0"
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="vigil-${version}-${GOOS}-${GOARCH}"
          mkdir -p "dist/${name}"
          binary="dist/${name}/vigil"
          [ "$GOOS" = "windows" ] && binary="${binary}.exe"
          go build -trimpath \
            -ldflags "-s -w -X github.com/LudwigJMarx/vigil/internal/cli.Version=${version}" \
            -o "$binary" ./cmd/vigil
          # THIRD-PARTY-NOTICES.md muss mit: MIT und BSD-3-Clause verlangen
          # beide, dass Urheberrechtsvermerk und Lizenztext der Weitergabe in
          # Binaerform beiliegen. Ein Archiv ohne die Datei ist ein Verstoss
          # gegen zehn fremde Lizenzen, und zwar einer, der nie auffaellt.
          cp README.md LICENSE NOTICE THIRD-PARTY-NOTICES.md "dist/${name}/"
          if [ "$GOOS" = "windows" ]; then
            (cd dist && zip -qr "${name}.zip" "${name}")
          else
            (cd dist && tar czf "${name}.tar.gz" "${name}")
          fi
          rm -rf "dist/${name}"

      - uses: actions/upload-artifact@v7
        with:
          name: vigil-${{ matrix.ziel.goos }}-${{ matrix.ziel.goarch }}
          path: dist/*
          if-no-files-found: error

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # Eine Pruefsumme, die niemand nachrechnen kann, ist Dekoration. Die Datei
      # liegt neben den Archiven und nennt jedes einzeln.
      - name: Pruefsummen
        run: |
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
