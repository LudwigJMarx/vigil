# Baut die Binaerdateien fuer eine Veroeffentlichung.
#
# Es gibt sie, weil "einfach einzusetzen" nur stimmt, wenn jemand ohne Go eine
# Datei herunterladen kann. CGO_ENABLED=0 ist dabei keine Vorsichtsmassnahme,
# sondern die Bedingung: der SQLite-Treiber ist reines Go, und nur deshalb
# entstehen diese fuenf Ziele aus einem Laeufer ohne C-Werkzeugkette.
#
# Der Versionsstempel kommt aus dem Tag. Ein Binary, das "dev" meldet, waehrend
# es aus einem Tag gebaut wurde, laesst jeden Fehlerbericht ins Leere laufen.
#
# ── WARUM DER ERSTE JOB DIE PRUEFUNGEN AUFRUFT ─────────────────────────────
#
# `Pruefungen` laeuft bei Push auf main und bei jedem Beitrag, aber nicht bei
# einem Tag. Am 17.09.2026 war v0.1.0 nur deshalb gedeckt, weil der getaggte
# Commit vorher ueber main gelaufen war. Ein Tag auf einen Commit, der das
# nicht war, waere ohne gofmt, ohne die Tests der Erweiterung und ohne den
# Lizenz-Pruefer veroeffentlicht worden.
#
# Die Pruefungen zusaetzlich auf Tags laufen zu lassen reicht dafuer nicht: sie
# liefen dann NEBEN dem Release und hielten nichts auf. Deshalb ruft `bauen`
# sie ueber `workflow_call` auf und haengt mit `needs` an ihrem Ergebnis.

name: Veroeffentlichen

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Derselbe Workflow, den main und jeder Beitrag durchlaufen. Aufgerufen,
  # nicht abgeschrieben.
  pruefen:
    uses: ./.github/workflows/pruefungen.yml

  bauen:
    needs: pruefen
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ziel:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Nichts veroeffentlichen, was nicht durch die Tests gegangen ist. Ein
      # Tag ist keine Pruefung.
      - name: Tests
        run: go test ./...

      - name: Bauen
        env:
          GOOS: ${{ matrix.ziel.goos }}
          GOARCH: ${{ matrix.ziel.goarch }}
          CGO_ENABLED: "0"
        run: |
          # Bei einem Tag ist GITHUB_REF_NAME "v0.1.0". Bei workflow_dispatch
          # ist es der Zweigname, und "main" waere eine Versionsnummer, die ein
          # Binary spaeter in jedem Fehlerbericht meldet.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-$(git rev-parse --short HEAD)"
          fi
          name="vigil-${version}-${GOOS}-${GOARCH}"
          mkdir -p "dist/${name}"
          binary="dist/${name}/vigil"
          [ "$GOOS" = "windows" ] && binary="${binary}.exe"
          go build -trimpath \
            -ldflags "-s -w -X github.com/LudwigJMarx/vigil/internal/cli.Version=${version}" \
            -o "$binary" ./cmd/vigil
          # THIRD-PARTY-NOTICES.md muss mit: MIT und BSD-3-Clause verlangen
          # beide, dass Urheberrechtsvermerk und Lizenztext der Weitergabe in
          # Binaerform beiliegen. Ein Archiv ohne die Datei ist ein Verstoss
          # gegen zehn fremde Lizenzen, und zwar einer, der nie auffaellt.
          cp README.md LICENSE NOTICE THIRD-PARTY-NOTICES.md "dist/${name}/"
          if [ "$GOOS" = "windows" ]; then
            (cd dist && zip -qr "${name}.zip" "${name}")
          else
            (cd dist && tar czf "${name}.tar.gz" "${name}")
          fi
          rm -rf "dist/${name}"

      - uses: actions/upload-artifact@v7
        with:
          name: vigil-${{ matrix.ziel.goos }}-${{ matrix.ziel.goarch }}
          path: dist/*
          if-no-files-found: error

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # Eine Pruefsumme, die niemand nachrechnen kann, ist Dekoration. Die Datei
      # liegt neben den Archiven und nennt jedes einzeln.
      #
      # Dass ALLE Archive da sind, garantiert `needs: bauen` zusammen mit
      # `if-no-files-found: error`: faellt ein Matrix-Ziel aus, laeuft dieser
      # Job gar nicht erst. Hier ist nur abzufangen, dass ueberhaupt etwas
      # angekommen ist - ein Release mit null Dateien ist sonst ein gruener Lauf.
      - name: Pruefsummen
        run: |
          cd dist
          ls -1
          anzahl=$(ls -1 vigil-*.tar.gz vigil-*.zip 2>/dev/null | wc -l | tr -d ' ')
          if [ "$anzahl" -eq 0 ]; then
            echo "Kein Archiv in dist/. Das Herunterladen der Artefakte hat nichts geliefert."
            exit 1
          fi
          sha256sum vigil-*.tar.gz vigil-*.zip > checksums.txt
          echo "$anzahl Archiv(e) mit Pruefsumme:"
          cat checksums.txt

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          # Ohne das ist ein Release ohne angehaengte Datei ein Erfolg.
          fail_on_unmatched_files: true
